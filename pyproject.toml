[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ab-initio-crp-qchem"
version = "1.0.0"
description = "Ab initio cavity reaction-potential methods implemented with PySCF"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20.0",
    "pyscf>=2.5.0",
]

[project.optional-dependencies]
examples = [
    "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]